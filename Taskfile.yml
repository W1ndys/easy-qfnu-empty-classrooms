# https://taskfile.dev
version: "3"

silent: true

vars:
  COMPOSE: docker compose
  HOST: '{{default "n100" .HOST}}'
  PORT: '{{default "22" .PORT}}'
  USER: '{{default "root" .USER}}'
  DIR: '{{default "/opt/easy-qfnu-kjs" .DIR}}'

tasks:
  default:
    desc: 显示开发与运维命令
    cmds:
      - |
        printf "开发命令:\n"
        printf "  task env-init        初始化本地 .env\n"
        printf "  task install         安装本地依赖\n"
        printf "  task up              启动 Docker 服务\n"
        printf "  task backend-dev     启动后端开发服务\n"
        printf "  task migrate-sqlite  将旧 SQLite 数据迁移到 PostgreSQL\n"
        printf "\n运维命令:\n"
        printf "  task deploy          一键部署 (默认: HOST=n100 PORT=22 USER=root DIR=/opt/easy-qfnu-kjs)\n"
        printf "  task deploy HOST=1.2.3.4 PORT=22 USER=root DIR=/srv/app   覆盖默认参数\n"

  env-init:
    desc: 初始化本地环境变量文件
    cmds:
      - |
        if [ -f .env ]; then
          printf ".env already exists\n"
        else
          cp .env.example .env
          printf "created .env from .env.example\n"
        fi

  install:
    desc: 安装本地开发依赖
    cmds:
      - task: install-go

  install-go:
    desc: 安装 Go 依赖
    cmds:
      - go mod download

  build:
    desc: 构建后端 Docker 镜像
    cmds:
      - '{{.COMPOSE}} build'

  up:
    desc: 构建并启动 PostgreSQL 与后端容器
    cmds:
      - '{{.COMPOSE}} up -d --build'

  down:
    desc: 停止并移除容器
    cmds:
      - '{{.COMPOSE}} down'

  logs:
    desc: 查看容器日志
    cmds:
      - '{{.COMPOSE}} logs --tail=200'

  ps:
    desc: 查看容器状态
    cmds:
      - '{{.COMPOSE}} ps'

  restart:
    desc: 重启容器
    cmds:
      - '{{.COMPOSE}} restart'

  backend-dev:
    desc: 启动后端本地开发服务
    cmds:
      - go run .

  migrate-sqlite:
    desc: 将旧 SQLite 查询日志和公告迁移到 PostgreSQL
    vars:
      SQLITE_PATH: '{{default "data/stats.db" .SQLITE_PATH}}'
      QUERY_LOG_TIMEZONE: '{{default "UTC" .QUERY_LOG_TIMEZONE}}'
      ANNOUNCEMENT_TIMEZONE: '{{default "UTC" .ANNOUNCEMENT_TIMEZONE}}'
    cmds:
      - >-
        go run ./cmd/migrate-sqlite-to-postgres
        -sqlite '{{.SQLITE_PATH}}'
        -query-log-timezone '{{.QUERY_LOG_TIMEZONE}}'
        -announcement-timezone '{{.ANNOUNCEMENT_TIMEZONE}}'

  deploy:
    desc: 本地构建镜像并上传到远端服务器部署
    cmds:
      - ./scripts/ops/deploy.sh '{{.HOST}}' '{{.PORT}}' '{{.USER}}' '{{.DIR}}'
